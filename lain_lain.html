<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>syair kanza28</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="lain_lain.css">
</head>
<body>
  
  <div class="container main-box">
      <!-- Tombol Pencarian Utama (Menggantikan Back Button) -->
      <button id="open-search-btn" class="main-search-button">
          <i class="fas fa-search"></i> Pencarian </button>
      
      <!-- Slider Judul -->
      <div class="title-slider-container">
          <div id="title-slides-wrapper" class="title-slides-wrapper"></div>
      </div>

      <!-- Wadah Teks Quote dari JSON -->
      <div id="quote-container"></div>
    
      

  <!-- Modal Pencarian Teks & ID -->
  <div id="search-modal" class="modal-overlay">
      <div class="modal-card">
          <h3>هذا من فضل ربي</h3>
          <input type="text" id="search-input" dir="auto" placeholder="Ketik kata kunci atau nomor..." autocomplete="off">
          
          <p id="search-error" style="color: #e53935; font-size: 0.85em; margin: 5px 0 10px; display: none;"></p>
          
          <div class="modal-buttons">
              <button id="modal-cancel" class="btn-secondary">Batal</button>
              <button id="modal-submit" class="btn-primary">Cari</button>
          </div>
      </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="lain_lain.js"></script>
</body>
</html>
