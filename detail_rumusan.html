<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Detail Rumusan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        @font-face {
            font-family: 'KfgqpcArabic';
            src: url('fonts/uthmanichafs.ttf') format('truetype'); 
            font-weight: normal;
            font-style: normal;
        }

        body { 
        background-color: #f0f0f0; 
        display: flex; 
        justify-content: center; 
        align-items: flex-start; /* Diubah dari center agar bisa di-scroll dari atas jika kontennya panjang */
        min-height: 100vh; 
        margin: 0; 
        font-family: sans-serif; 
        padding: 20px 0; /* Memberi ruang napas atas-bawah pada mode desktop */
        box-sizing: border-box;
    }
        .container { 
    background-color: #fff8e1; 
    border-radius: 12px;       /* Bisa disesuaikan agar sudutnya pas */
    padding: 5px;              /* Padding dalam tetap 5px */
    width: 98%;                /* Membuat kontainer hampir memenuhi layar HP */
    max-width: 100%;           /* Membuang batas maksimal yang membuatnya menyisakan ruang di kiri-kanan */
    box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
    text-align: center; 
    box-sizing: border-box;
    margin: 0 auto;            /* Posisikan tetap di tengah */
        }

        /* TAMBAHAN KODE BARU: KETIKA DIBUKA DI LAYAR DESKTOP / TABLET */
    @media (min-width: 768px) {
        .container {
            max-width: 800px; /* Lebar kontainer memanjang ke samping menyerupai lembar kitab digital */
            padding: 30px;
        }
    }


        .title { color: white; font-weight: 700; margin-bottom: 20px; font-size: 1.3em; padding: 10px; border-radius: 15px; background-color: #8b4513; border: 3px solid #6d4c41; }
        .section-group { margin-top: 15px; padding: 5px; border: 1px solid #d88998; border-radius: 10px; background-color: #ffffff; text-align: left; }
        .section-title { font-weight: bold; color: #c2185b; border-bottom: 2px solid #f8bbd0; margin-bottom: 5px; font-size: 0.9em; }
        
        .content-text { 
            font-size: 0.9em; 
            color: #6d4c41; 
            line-height: 1.6; 
            text-align: justify; 
            margin: 5px 0; 
            white-space: pre-line;
        }
        
        /* GAYA HIGHLIGHT BIRU SEMUA KATA */
        .highlight-blue { background-color: #FFB6C1; color: #c2185b; font-weight: bold; padding: 0 2px; border-radius: 3px; }

           .copy-button { 
        background-color: #795548; 
        color: white; 
        border: none; 
        padding: 10px 15px; 
        border-radius: 20px; 
        cursor: pointer; 
        font-weight: bold; 
        margin-bottom: 10px; 
        width: auto; 
        min-width: 130px; /* Menyesuaikan ukuran tombol salin agar rapi */
           }
        .back-button { background-color: #ffffff; cursor: pointer; display: block; font-family: 'Georgia', sans-serif; margin-bottom: 10px; color: #c2185b; font-weight: bold; border: 2px solid #d88998; border-radius: 20px; padding: 5px 15px; width: fit-content; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); }
        .copy-notification { visibility: hidden; min-width: 200px; background-color: #333; color: #fff; text-align: center; border-radius: 5px; padding: 10px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); opacity: 0; transition: 0.5s; z-index: 1000; }
        .copy-notification.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <span class="back-button" onclick="history.back()">KANZA28</span>
        <h1 class="title" id="detailTitle">Memuat...</h1>
        <button id="copyButton" class="copy-button"><i class="fas fa-copy"></i> Salin Teks</button>
        <div id="rumusanContent"></div>
    </div>

    <div id="copyNotification" class="copy-notification">Berhasil disalin!</div>

<script src="daftar_rumusan.js"></script>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const rumusanId = urlParams.get('id');
    const highlightKey = urlParams.get('highlight');

    function removeDiacritics(text) {
        return text.replace(/[\u064B-\u0652]/g, "");
    }

    function applyGlobalHighlight() {
        if (!highlightKey) return;
        const container = document.getElementById('rumusanContent');
        const cleanKey = removeDiacritics(highlightKey).toLowerCase();
        const arabicDiacritics = "[\\u064B-\\u0652]*";
        
        const regexPattern = cleanKey.split('').map(char => {
            let escapedChar = char.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            if (/[\u0622\u0623\u0625\u0627]/.test(char)) {
                escapedChar = "[\\u0622\\u0623\\u0625\\u0627]";
            }
            return /[\u0600-\u06FF]/.test(char) ? escapedChar + arabicDiacritics : escapedChar;
        }).join('');

        const regex = new RegExp(`(${regexPattern})`, 'gi');

        const walk = (node) => {
            let child = node.firstChild;
            while (child) {
                const next = child.nextSibling;
                if (child.nodeType === 3) {
                    const originalText = child.nodeValue;
                    if (regex.test(originalText)) {
                        const span = document.createElement('span');
                        span.innerHTML = originalText.replace(regex, '<span class="highlight-blue">$1</span>');
                        child.parentNode.replaceChild(span, child);
                    }
                } else if (child.nodeType === 1 && child.tagName !== 'SPAN') {
                    walk(child);
                }
                child = next;
            }
        };
        walk(container);
    }

    if (rumusanId) {
        muatSemuaDataRumusan().then(data => {
            const item = data.find(i => i.id === rumusanId);
            if (item) {
                document.getElementById('detailTitle').innerHTML = item.judul_pendek;

                // Logika Referensi dengan Deteksi Judul Kitab yang Aman
                const referensiArr = item.referensi || [];
let refHtml = '';

for (let i = 0; i < referensiArr.length; i++) {
    const teks = referensiArr[i];
    const isAr = /[\u0600-\u06FF]/.test(teks);
    
    const isKitabTitle = teks.includes('ج:') || teks.includes('ص:');
    
    if (isKitabTitle) {
        const marginTopStyle = i > 0 ? 'margin-top: 25px; margin-bottom: 5px;' : 'margin-bottom: 5px;';
        refHtml += `<p class="content-text" ${isAr ? `style="direction:rtl; text-align:justify; text-justify:inter-word; font-family:'KfgqpcArabic', serif; font-size:1.1em; font-weight:bold; ${marginTopStyle}"` : `style="${marginTopStyle}"`}>${teks}</p>`;
    } else {
        refHtml += `<p class="content-text" ${isAr ? 'style="direction:rtl; text-align:justify; text-justify:inter-word; font-family:\'KfgqpcArabic\', serif; font-size:1.1em; margin-top: 0; margin-bottom: 0;"' : 'style="margin-top: 0; margin-bottom: 0;"'}>${teks}</p>`;
    }
}


                function formatTeksCampuran(teks) {
    if (!teks) return '';
    const baris = teks.split('\n');
    return baris.map(b => {
        const teksBersih = b.trim();
        if (!teksBersih) {
            return `<div style="height: 10px;"></div>`;
        }
        const isArab = /[\u0600-\u06FF]/.test(teksBersih);
        if (isArab) {
            return `<p class="content-text" dir="rtl" style="direction: rtl; font-family: 'KfgqpcArabic', serif; text-align: justify; text-justify: inter-word; font-size: 1.15em; margin-bottom: 8px;">${teksBersih}</p>`;
        } else {
            return `<p class="content-text" dir="ltr" style="text-align: justify; margin-bottom: 8px;">${teksBersih}</p>`;
        }
    }).join('');
}


                const deskripsiHtml = formatTeksCampuran(item.deskripsi);
                const pertanyaanHtml = formatTeksCampuran(item.pertanyaan);
                const jawabanHtml = formatTeksCampuran(item.jawaban);

                document.getElementById('rumusanContent').innerHTML = `
                    <div class="section-group">
                        <div class="section-title">Deskripsi:</div>
                        ${deskripsiHtml}
                    </div>

                    <div class="section-group">
                        <div class="section-title">Pertanyaan:</div>
                        ${pertanyaanHtml}
                    </div>

                    <div class="section-group">
                        <div class="section-title">Jawaban:</div>
                        ${jawabanHtml}
                    </div>

                    <div class="section-group">
                        <div class="section-title">Referensi:</div>
                        ${refHtml}
                    </div>
                `;

                setTimeout(applyGlobalHighlight, 800);

                document.getElementById('copyButton').onclick = async () => {
    // Membersihkan tag <br> pada judul pendek menjadi enter (\n)
    const rawTitle = item.judul_pendek || '';
    const cleanTitle = rawTitle.replace(/<br\s*[\/]?>/gi, '\n');

    // Memformat referensi agar nama kitab (yang ada ج: atau ص:) memiliki jarak enter di atasnya
    const referensiArr = item.referensi || [];
    let formattedRefArr = [];

    for (let i = 0; i < referensiArr.length; i++) {
        const teks = referensiArr[i];
        const isKitabTitle = teks.includes('ج:') || teks.includes('ص:');

        if (isKitabTitle && i > 0) {
            formattedRefArr.push('\n' + teks);
        } else {
            formattedRefArr.push(teks);
        }
    }
    const refTxt = formattedRefArr.join('\n');

    const txt = `JUDUL:\n${cleanTitle}\n\nDESKRIPSI:\n${item.deskripsi}\n\nPERTANYAAN:\n${item.pertanyaan}\n\nJAWABAN:\n${item.jawaban}\n\nREFERENSI:\n${refTxt}`;

    await navigator.clipboard.writeText(txt);
    const n = document.getElementById('copyNotification');
    n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 2000);
};

            }
        });
    }
</script>

</body>
</html>
