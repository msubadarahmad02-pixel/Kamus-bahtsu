<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Lihat Materi PDF - Kamus Bahtsu Kanza</title>
    <link rel="stylesheet" href="styles.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.css">
    
    <style>
        /* --- KOREKSI: MENGHILANGKAN EFEK KOTAK DAN MEMPERBESAR TAMPILAN --- */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #f7f7f7; /* Latar belakang untuk seluruh halaman */
        }
        .container {
            width: 100vw; /* Menggunakan 100% lebar viewport */
            max-width: none; 
            padding: 0; /* Hapus padding agar konten penuh */
            min-height: 100vh;
            box-shadow: none; 
            border-radius: 0; 
            background-color: #f7f7f7; /* Latar belakang container */
        }

        /* Gaya tambahan untuk penampil PDF */
        #pdf-viewer-container {
            width: 100%;
            /* Mengatur tinggi agar tidak tertutup bilah kontrol */
            height: calc(100vh - 110px); 
            overflow: auto;
            text-align: center; 
            padding: 10px 0; /* Tambahkan sedikit padding vertikal untuk pemisah visual */
        }
        #pdf-canvas {
            margin: 0 auto; /* Tengah secara horizontal */
            border: 1px solid #ccc;
            display: block; 
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2); /* Bayangan yang lebih menonjol */
            background-color: white; /* Halaman terlihat putih */
        }
        .pagination {
            /* Layout terpusat sederhana */
            text-align: center;
            padding: 10px 5px;
            background-color: #fff8e1; /* Warna lebih terang, cocok dengan KANZA */
            border-bottom: 1px solid #e0e0e0; /* Border bawah */
            position: sticky; /* KONTROL: Selalu terlihat di bagian atas */
            top: 0;
            z-index: 100; 
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Bayangan kecil untuk kesan terangkat */
        }
        .pagination button {
            padding: 8px 12px;
            margin: 0 3px; 
            cursor: pointer;
            border: 1px solid #a0a0a0;
            background-color: white;
            border-radius: 4px;
            transition: all 0.2s; 
        }
        .pagination button:hover:not(:disabled) {
            background-color: #ffe0b2; /* Efek hover */
        }
        .pagination button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            background-color: #eeeeee;
        }
        .zoom-controls {
            display: inline-flex; 
            align-items: center;
            margin-left: 15px; 
        }
        #pageNumberInput {
            width: 45px; 
            text-align: center; 
            padding: 5px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            margin: 0 5px;
        }
        .back-button {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 5px 10px;
            cursor: pointer;
            background: #e0e0e0;
            border-radius: 4px;
            font-weight: bold;
            z-index: 110;
        }
        .title {
            text-align: center;
            margin: 10px 0 0;
            color: #333333;
        }
    </style>
</head>
<body>

    <div class="container pdf-viewer-page">
        
        

        <div class="pagination">
            
            <button id="prev-page" disabled title="Halaman Sebelumnya">
                <i class="fas fa-chevron-left"></i>
            </button>
            
            <span style="display: inline-flex; align-items: center; margin: 0 10px;">
                <input type="number" id="pageNumberInput" value="1" min="1" >
                <span id="pageTotalDisplay" style="margin-right: 5px;">dari ?</span>
                <button id="goToPage" title="Langsung ke Halaman" disabled>Go</button>
            </span>
            
            <button id="next-page" disabled title="Halaman Selanjutnya">
                <i class="fas fa-chevron-right"></i>
            </button>
            
            <span class="zoom-controls">
                <button id="zoom-out" title="Perkecil" disabled><i class="fas fa-search-minus"></i></button>
                <span id="scale-display" style="margin: 0 8px; font-weight: bold;">100%</span>
                <button id="zoom-in" title="Perbesar" disabled><i class="fas fa-search-plus"></i></button>
            </span>
        </div>

        <div id="pdf-viewer-container">
            <canvas id="pdf-canvas"></canvas>
        </div>
        
    </div>

<script>
    document.addEventListener('DOMContentLoaded', function() {

        // --- Inisialisasi Variabel dan Elemen DOM ---
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        
        let currentScale = 4.0; 
        const SCALE_STEP = 0.50; 
        const MIN_SCALE = 0.50; 
        const MAX_SCALE = 4.00; 
            
        const pdfViewerContainer = document.getElementById('pdf-viewer-container');
        const prevButton = document.getElementById('prev-page');
        const nextButton = document.getElementById('next-page');
        
        const zoomInButton = document.getElementById('zoom-in');
        const zoomOutButton = document.getElementById('zoom-out');
        const scaleDisplay = document.getElementById('scale-display');

        // Elemen Go-To-Page
        const pageNumberInput = document.getElementById('pageNumberInput');
        const pageTotalDisplay = document.getElementById('pageTotalDisplay');
        const goToPageButton = document.getElementById('goToPage');

        // Menggunakan canvas yang sudah ada di HTML
        const canvas = document.getElementById('pdf-canvas'); 
        const ctx = canvas.getContext('2d');

        // --- PDF.js Setup ---
        if (typeof pdfjsLib !== 'undefined') {
            // Gunakan versi worker yang sesuai dengan versi lib yang dimuat (2.16.105)
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        } else {
            console.error('Error: Library PDF.js gagal dimuat.');
            pdfViewerContainer.innerHTML = '<p style="text-align: center; color: red;">Error: Library PDF.js gagal dimuat.</p>';
            return;
        }
        
        // --- Fungsi Helper ---

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
        
        // Fungsi untuk merender halaman 
        function renderPage(num) {
            pageRendering = true;
            
            // Nonaktifkan sementara semua kontrol saat rendering
            // pageNumberInput tidak perlu di-disable; biarkan pengguna mengetik
            prevButton.disabled = true;
            nextButton.disabled = true;
            zoomInButton.disabled = true;
            zoomOutButton.disabled = true;
            goToPageButton.disabled = true;
            // pageNumberInput.disabled = true; // Biarkan aktif untuk input

            pdfDoc.getPage(num).then(function(page) {
                
                const viewport = page.getViewport({scale: currentScale});
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                const renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }

                    // Aktifkan kembali kontrol setelah rendering selesai
                    prevButton.disabled = num <= 1;
                    nextButton.disabled = num >= pdfDoc.numPages;
                    zoomInButton.disabled = currentScale >= MAX_SCALE;
                    zoomOutButton.disabled = currentScale <= MIN_SCALE;
                    goToPageButton.disabled = false;
                    // pageNumberInput.disabled = false;
                });
                
                // Perbarui info halaman
                pageNumberInput.value = num;
                pageTotalDisplay.textContent = 'dari ' + pdfDoc.numPages;
                pageNumberInput.setAttribute('max', pdfDoc.numPages);

                scaleDisplay.textContent = Math.round(currentScale * 100) + '%';
            });
        }

        function queueRenderPage(num) {
            num = Math.floor(num); // Pastikan angka bulat
            if (num < 1 || num > pdfDoc.numPages) return; // Batasi angka

            if (pageRendering) {
                pageNumPending = num;
            } else {
                pageNum = num;
                renderPage(num);
            }
        }
        
        // --- Fungsi Lompat Halaman ---
        function goToPage() {
            const desiredPage = parseInt(pageNumberInput.value, 10);
            
            if (pdfDoc) {
                const totalPages = pdfDoc.numPages;

                if (desiredPage >= 1 && desiredPage <= totalPages) {
                    queueRenderPage(desiredPage);
                } else {
                    alert('Nomor halaman tidak valid. Masukkan angka antara 1 dan ' + totalPages + '.');
                    pageNumberInput.value = pageNum; 
                }
            }
        }
        
        // --- Event Listeners ---
        
        zoomInButton.addEventListener('click', function() {
            if (currentScale < MAX_SCALE) { 
                currentScale += SCALE_STEP;
                currentScale = Math.min(currentScale, MAX_SCALE); 
                queueRenderPage(pageNum);
            }
        });
        
        zoomOutButton.addEventListener('click', function() {
            if (currentScale > MIN_SCALE) { 
                currentScale -= SCALE_STEP;
                currentScale = Math.max(currentScale, MIN_SCALE); 
                queueRenderPage(pageNum);
            }
        });

        prevButton.addEventListener('click', function() {
            if (pageNum > 1) {
                queueRenderPage(pageNum - 1);
            }
        });

        nextButton.addEventListener('click', function() {
            if (pdfDoc && pageNum < pdfDoc.numPages) {
                queueRenderPage(pageNum + 1);
            }
        });

        goToPageButton.addEventListener('click', goToPage);

        pageNumberInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                goToPage();
            }
        });
        
        // --- Memuat Dokumen ---
        
        const pdfPath = getQueryParam('file');
        
        if (pdfPath) {
            pageTotalDisplay.textContent = 'dari ?'; 
            
            pdfjsLib.getDocument(pdfPath).promise.then(function(pdfDoc_) {
                pdfDoc = pdfDoc_;
                
                // Hitung skala awal (Fit-to-Width) HANYA JIKA currentScale masih default (1.0)
                if (currentScale === 1.0) { 
                    pdfDoc.getPage(pageNum).then(function(page) {
                        const containerWidth = pdfViewerContainer.clientWidth;
                        const originalViewport = page.getViewport({ scale: 1 });
                        
                        // Kalkulasi skala baru
                        let newScale = containerWidth / originalViewport.width;
                        newScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE); 
                        currentScale = newScale; // Update currentScale
                        
                        renderPage(pageNum);
                    });
                } else {
                    renderPage(pageNum);
                }
                
            }).catch(function(error) {
                console.error('Error loading PDF:', error);
                pdfViewerContainer.innerHTML = '<p style="text-align: center; color: red;">Gagal memuat dokumen PDF. Pastikan jalur file sudah benar dan dapat diakses.</p>';
                pageTotalDisplay.textContent = 'Gagal memuat';
                // Nonaktifkan semua kontrol jika gagal
                prevButton.disabled = true;
                nextButton.disabled = true;
                zoomInButton.disabled = true;
                zoomOutButton.disabled = true;
                goToPageButton.disabled = true;
            });
        } else {
            pdfViewerContainer.innerHTML = '<p style="text-align: center; color: red;">Tidak ada file PDF yang ditentukan.</p>';
            pageTotalDisplay.textContent = 'Error';
        }

        // Responsif saat orientasi atau ukuran jendela berubah
        let resizeTimeout;
        window.addEventListener('resize', () => {
             // KOREKSI: Gunakan setTimeout untuk debounce
             clearTimeout(resizeTimeout);
             resizeTimeout = setTimeout(() => {
                // Render ulang hanya jika skala saat ini dekat dengan fit-to-width
                // Ini mempertahankan zoom manual jika pengguna melakukannya
                if (pdfDoc && currentScale <= 1.1) { 
                    // Ulangi logika fit-to-width
                    pdfDoc.getPage(pageNum).then(function(page) {
                        const containerWidth = pdfViewerContainer.clientWidth;
                        const originalViewport = page.getViewport({ scale: 1 });
                        
                        let newScale = containerWidth / originalViewport.width;
                        newScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE); 
                        currentScale = newScale; 
                        
                        queueRenderPage(pageNum);
                    });
                }
             }, 300); // Tunggu 300ms setelah selesai resize
        });
        
    });
</script>

</body>
</html>
