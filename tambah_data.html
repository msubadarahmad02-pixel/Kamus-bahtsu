<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanza - Tambah Kitab</title>
    <link rel="stylesheet" href="tambah_data.css">
</head>
<body>

<div class="container">
    <div class="form-box">
        <h3>Formulir Untuk Menambah Kitab Baru</h3>
        
        <label for="halaman">Nomor Halaman:</label>
        <input type="number" id="halaman" placeholder="Contoh: 15">
        
        <label for="matan">Isi Matan:</label>
        <textarea id="matan" placeholder="Masukkan isi teks matan..."></textarea>
        
        <label for="syarah">Isi Syarah:</label>
        <textarea id="syarah" class="tall-textarea" placeholder="Masukkan isi teks syarah..."></textarea>
        
        <button onclick="hasilJSON()" class="btn-generate">Generate (Buat Kitab Baru)</button>
        
        <hr>
        
        <label>Hasil Output:</label>
        <textarea id="output" readonly placeholder="Hasil akan muncul di sini..."></textarea>
        
        <div class="button-group">
            <button onclick="copyToClipboard()" class="btn-copy">Salin📋</button>
            <button onclick="sendToWhatsApp()" class="btn-wa">Kirim💬</button>
        </div>
    </div>
</div>


<div id="customAlert" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-icon">🫰</div>
        <div id="modalMessage" class="modal-message">Generate dulu nduk!</div>
        <button onclick="closeAlert()" class="modal-btn">Oke</button>
    </div>
</div>
    
<script src="tambah_data.js"></script>
</body>
</html>
